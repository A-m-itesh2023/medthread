name: Update tests and packages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-catalog:
    if: github.event.head_commit.message != 'Expand tests and packages catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update diagnostic catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text()

          replacement = r'''function Tests(){
            const [priceFilter,setPriceFilter]=useState('All')
