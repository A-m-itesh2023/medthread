d(null)}><div className="space-y-4"><p className="text-sm leading-6 text-muted-foreground">{selected.detail}</p><div className="grid gap-3 sm:grid-cols-2"><div className="rounded-2xl bg-secondary p-4"><p className="text-xs font-bold uppercase tracking-wider text-muted-foreground">Sample</p><p className="mt-1 font-bold">{selected.sample}</p></div><div className="rounded-2xl bg-secondary p-4"><p className="text-xs font-bold uppercase tracking-wider text-muted-foreground">Preparation</p><p className="mt-1 text-sm font-semibold">{selected.prep}</p></div><div className="rounded-2xl bg-secondary p-4"><p className="text-xs font-bold uppercase tracking-wider text-muted-foreground">Expected report</p><p className="mt-1 font-bold">{selected.reports}</p></div><div className="rounded-2xl bg-secondary p-4"><p className="text-xs font-bold uppercase tracking-wider text-muted-foreground">Demo price</p><p className="mt-1 font-display text-xl font-bold text-primary">₹{selected.price}</p></div></div><div><p className="text-sm font-bold">Included tests / markers</p><ul className="mt-2 grid gap-2 sm:grid-cols-2">{selected.items.map((item:string)=><li key={item} className="rounded-xl border border-border px-3 py-2 text-sm">✓ {item}</li>)}</ul></div><p className="text-xs leading-5 text-muted-foreground">This is a demonstration catalog, not medical advice. Exact test composition, fasting requirements, turnaround time, and interpretation depend on the laboratory and clinical context.</p><button onClick={()=>{window.alert(`${selected.title} added to your demo care journey.`);setSelected(null)}} className="w-full rounded-xl bg-primary px-4 py-3 font-bold text-primary-foreground">Book this test</button></div></Modal>}</PageShell>
          }

