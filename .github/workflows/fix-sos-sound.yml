name: Fix SOS sound trigger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix SOS sound trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SOS click sound
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          marker = "const CART_KEY='medthread-demo-cart'"
          helper = r'''\nfunction playSOSBeep(){\n  try {\n    const AudioContextClass = window.AudioContext || (window as any).webkitAudioContext\n    if (!AudioContextClass) return\n    const ctx = new AudioContextClass()\n    const start = ctx.currentTime + 0.01\n    const beep = (frequency: number, at: number) => {\n      const oscillator = ctx.createOscillator()\n      const gain = ctx.createGain()\n      oscillator.type = 'sine'\n      oscillator.frequency.value = frequency\n      gain.gain.setValueAtTime(0.0001, at)\n      gain.gain.exponentialRampToValueAtTime(0.45, at + 0.01)\n      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.2)\n      oscillator.connect(gain)\n      gain.connect(ctx.destination)\n      oscillator.start(at)\n      oscillator.stop(at + 0.2)\n    }\n    void ctx.resume()\n    beep(880, start)\n    beep(1040, start + 0.25)\n    window.setTimeout(() => void ctx.close(), 650)\n  } catch {}\n}\n'''
          if 'function playSOSBeep()' not in s:
              s = s.replace(marker, marker + helper, 1)
          if 'onPointerDown={playSOSBeep}' not in s:
              s = s.replace('href="/sos"', 'href="/sos" onPointerDown={playSOSBeep}', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix SOS sound trigger'
          git push